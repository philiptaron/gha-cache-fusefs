name: fusefs

on:
  # Branches are covered by their pull requests; pushing to both would run two
  # real-cache pipelines at once, competing for the entry-creation budget.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # The mount lists cache entries through the REST API; cleanup deletes them.
  actions: write
  contents: read

# A newer push to a pull request supersedes its older runs.
concurrency:
  group: fusefs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Each run mounts a volume of its own, which cleanup deletes. Within it,
  # each chain of jobs writes below its own directory ($RUN/e2e, $RUN/interop,
  # $RUN/action-N): the e2e phases rm -rf their directory, and a whiteout from
  # one job rightly hides another job's file.
  VOLUME: ci-${{ github.run_id }}-${{ github.run_attempt }}
  RUN: e2e/${{ github.run_id }}-${{ github.run_attempt }}

# The real-cache jobs need a writable cache and `actions: write`, which pull
# requests from forks do not get; they run only when
#   github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

jobs:
  build:
    name: Build the static binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs .#static
      - run: |
          cp result/bin/gha-cache-fusefs .
          file gha-cache-fusefs
          ./gha-cache-fusefs --version
      - uses: actions/upload-artifact@v7
        with:
          name: gha-cache-fusefs
          path: gha-cache-fusefs
          if-no-files-found: error

  check:
    name: nix flake check (tests, clippy, rustfmt, NixOS VM test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Let the runner user use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check --print-build-logs --keep-going

  fake:
    name: FUSE against the fake cache service
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gha-cache-fusefs
          path: bin
      - run: |
          chmod +x bin/gha-cache-fusefs
          sudo apt-get install -y squashfuse >/dev/null
      - name: Write, read, and verify as an unprivileged user
        run: |
          bin/gha-cache-fusefs fake-server --env-file "$RUNNER_TEMP/fake.env" >"$RUNNER_TEMP/fake.log" 2>&1 &
          for _ in $(seq 100); do [ -s "$RUNNER_TEMP/fake.env" ] && break; sleep 0.1; done
          set -a
          . "$RUNNER_TEMP/fake.env"
          set +a
          export BIN=$PWD/bin/gha-cache-fusefs MNT=$RUNNER_TEMP/cache RUN=fake
          for phase in write read verify; do bash fusefs/tests/e2e.sh "$phase"; done
      - name: Logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/gha-cache-fusefs/*/daemon.log "$RUNNER_TEMP/fake.log"; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  e2e-write:
    name: "Real cache 1/3: write"
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gha-cache-fusefs
          path: bin
      - run: chmod +x bin/gha-cache-fusefs
      - uses: ./mount
        with:
          path: /mnt/cache
          volume: ${{ env.VOLUME }}
          binary: bin/gha-cache-fusefs
          settle: 200ms
          log: info,gha_cache_fusefs=debug
      - run: bash fusefs/tests/e2e.sh write
        env:
          MNT: /mnt/cache
          EXTERNAL_MOUNT: 1
          RUN: ${{ env.RUN }}/e2e

  e2e-read:
    name: "Real cache 2/3: read and modify"
    needs: e2e-write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gha-cache-fusefs
          path: bin
      - run: |
          chmod +x bin/gha-cache-fusefs
          sudo apt-get install -y squashfuse >/dev/null
      - uses: ./mount
        with:
          path: /mnt/cache
          volume: ${{ env.VOLUME }}
          binary: bin/gha-cache-fusefs
          settle: 200ms
          log: info,gha_cache_fusefs=debug
        env:
          # So that unmounting writes a snapshot of the write job's layers,
          # which the verify job then mounts from. They are minutes old, and
          # on the real service the write job makes about ten.
          GHA_CACHE_FUSEFS_SNAPSHOT_MARGIN: 5s
          GHA_CACHE_FUSEFS_SNAPSHOT_AFTER: 4
      - run: bash fusefs/tests/e2e.sh read
        env:
          MNT: /mnt/cache
          EXTERNAL_MOUNT: 1
          RUN: ${{ env.RUN }}/e2e

  e2e-verify:
    name: "Real cache 3/3: verify and remove"
    needs: e2e-read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gha-cache-fusefs
          path: bin
      - run: chmod +x bin/gha-cache-fusefs
      - uses: ./mount
        id: mount
        with:
          path: /mnt/cache
          volume: ${{ env.VOLUME }}
          binary: bin/gha-cache-fusefs
          settle: 200ms
          log: info,gha_cache_fusefs=debug
      - name: The mount read the read job's snapshot
        run: grep -E ' [1-9][0-9]* snapshots read' '${{ steps.mount.outputs.state-dir }}/daemon.log'
      - run: bash fusefs/tests/e2e.sh verify
        env:
          MNT: /mnt/cache
          EXTERNAL_MOUNT: 1
          RUN: ${{ env.RUN }}/e2e

  action:
    name: The mount action on its own (${{ matrix.binary }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: built with the runner's cargo
            release: ''
          - binary: downloaded from main-latest
            release: main-latest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./mount
        with:
          path: /mnt/cache
          volume: ${{ env.VOLUME }}
          release: ${{ matrix.release }}
      - name: A second mount in the same job reuses the download
        if: matrix.release != ''
        uses: ./mount
        with:
          path: /mnt/cache2
          volume: ${{ env.VOLUME }}
          release: ${{ matrix.release }}
          read-only: true
      - name: Smoke test
        env:
          LEG: ${{ strategy.job-index }}
        run: |
          d="/mnt/cache/$RUN/action-$LEG"
          mkdir -p "$d"
          echo "hello from $GITHUB_JOB" > "$d/hello"
          [ "$(cat "$d/hello")" = "hello from $GITHUB_JOB" ]
          ls -la "$d"
          df -h /mnt/cache
          if mountpoint -q /mnt/cache2; then ls -la /mnt/cache2; fi

  # Interop with actions/cache. An entry that actions/cache saves among the
  # volume's keys must stay invisible to the mount, and actions/cache must
  # not restore what the mount wrote, not even through restore-keys prefix
  # matching.
  interop-write:
    name: "Interop 1/2: actions/cache saves, the filesystem looks"
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gha-cache-fusefs
          path: bin
      - run: |
          chmod +x bin/gha-cache-fusefs
          mkdir interop-src
          echo "saved by actions/cache" >interop-src/file
      - name: actions/cache saves among the volume's keys
        uses: actions/cache/save@v6
        with:
          key: gha-fs/${{ env.VOLUME }}/interop-from-actions-cache
          path: interop-src
      - name: actions/cache saves elsewhere
        uses: actions/cache/save@v6
        with:
          key: interop-${{ env.RUN }}
          path: interop-src
      - id: mount
        uses: ./mount
        with:
          path: /mnt/cache
          volume: ${{ env.VOLUME }}
          binary: bin/gha-cache-fusefs
          settle: 200ms
      - name: The filesystem lists the foreign entry but does not show it
        env:
          LOG: ${{ steps.mount.outputs.state-dir }}/daemon.log
        run: |
          d="/mnt/cache/$RUN/interop"
          grep 'listed' "$LOG"
          ignored=$(grep -oE '[0-9]+ ignored' "$LOG" | head -1 | cut -d' ' -f1)
          [ "$ignored" -ge 1 ] || { echo "the actions/cache entry was not even listed"; exit 1; }
          [ ! -e "$d/from-actions-cache" ] || { echo "an actions/cache entry is visible"; exit 1; }
          mkdir -p "$d"
          echo "written through the mount" >"$d/from-fusefs"
          ls -la "$d"

  interop-read:
    name: "Interop 2/2: actions/cache restores, the filesystem looks"
    needs: interop-write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gha-cache-fusefs
          path: bin
      - run: chmod +x bin/gha-cache-fusefs
      - name: actions/cache prefix-matches the layers the filesystem wrote
        id: theirs
        uses: actions/cache/restore@v6
        with:
          key: interop-miss-${{ env.RUN }}
          restore-keys: gha-fs/${{ env.VOLUME }}/layer/
          path: interop-src
      - name: actions/cache prefix-matches the whole volume
        id: prefix
        uses: actions/cache/restore@v6
        with:
          key: interop-miss-${{ env.RUN }}
          restore-keys: gha-fs/${{ env.VOLUME }}/
          path: interop-src
      - name: actions/cache restores its own entry
        id: own
        uses: actions/cache/restore@v6
        with:
          key: gha-fs/${{ env.VOLUME }}/interop-from-actions-cache
          path: interop-src
      - uses: ./mount
        with:
          path: /mnt/cache
          volume: ${{ env.VOLUME }}
          binary: bin/gha-cache-fusefs
          read-only: true
      - name: Each side sees only its own entries
        env:
          THEIRS_HIT: ${{ steps.theirs.outputs.cache-hit }}
          THEIRS_MATCHED: ${{ steps.theirs.outputs.cache-matched-key }}
          PREFIX_MATCHED: ${{ steps.prefix.outputs.cache-matched-key }}
          OWN_HIT: ${{ steps.own.outputs.cache-hit }}
        run: |
          set -x
          [ "$THEIRS_HIT" != true ] && [ -z "$THEIRS_MATCHED" ]
          [ "$PREFIX_MATCHED" = "gha-fs/$VOLUME/interop-from-actions-cache" ]
          [ "$OWN_HIT" = true ] && [ "$(cat interop-src/file)" = "saved by actions/cache" ]
          [ "$(cat "/mnt/cache/$RUN/interop/from-fusefs")" = "written through the mount" ]
          [ ! -e "/mnt/cache/$RUN/interop/from-actions-cache" ]
          ls -la "/mnt/cache/$RUN/interop"

  e2e-cleanup:
    name: Delete this run's cache entries
    needs: [e2e-write, e2e-read, e2e-verify, action, interop-write, interop-read]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=gha-fs/$VOLUME/&per_page=100" --jq '.actions_caches[].id')
          ids="$ids $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=interop-$RUN&per_page=100" --jq '.actions_caches[].id')"
          # A binary from before volumes (the main-latest release, until it
          # is rebuilt with them) writes format 1 under fusefs/ instead.
          ids="$ids $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=fusefs/$RUN/&per_page=100" --jq '.actions_caches[].id')"
          ids="$ids $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=fusefs/e2e/&per_page=100" --jq '.actions_caches[] | select(.key == "fusefs/e2e/") | .id')"
          n=0
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" >/dev/null && n=$((n + 1))
          done
          echo "deleted $n entries"
