[package]
name = "gha-cache-fusefs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Mount the GitHub Actions cache as a FUSE filesystem"
repository = "https://github.com/philiptaron/gha-cache-fusefs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4"
humantime = "2"
libc = "0.2"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"

# macOS can type-check the FUSE adapter without macFUSE installed; it cannot mount.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18", features = ["macos-no-mount"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = "line-tables-only"
